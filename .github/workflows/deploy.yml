# Deploys the API to Fly.io on push to main. The Fly health check on /health (which pings Atlas)
# gates the rollout, so a build that can't reach Mongo never replaces the running machine.
#
# One-time setup before this runs (see DEPLOYMENT.md):
#   Repository variable:
#     DEPLOY_ENABLED  = "true"   (gate; the job is skipped until this is set)
#   Repository secret:
#     FLY_API_TOKEN   = output of `fly tokens create deploy -a nhl-stats-api`

name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
