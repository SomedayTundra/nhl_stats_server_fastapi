# Redeploys the API + Mongo + Caddy stack on the Lightsail box over SSH.
#
# One-time setup before this runs:
#   Repository variable:
#     DEPLOY_ENABLED     = "true"   (gate; the job is skipped until this is set)
#   Repository secrets:
#     LIGHTSAIL_HOST     = the instance's static IP
#     LIGHTSAIL_USER     = deploy user (e.g. ubuntu)
#     LIGHTSAIL_SSH_KEY  = private key whose public half is in that user's ~/.ssh/authorized_keys
#   The box must already have: Docker + compose plugin, the repo cloned at
#   ~/nhl_stats_server_fastapi, and a populated .env (see .env.example).

name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd ~/nhl_stats_server_fastapi
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
