# Fly.io app for the API (https://api.somedaytundra.com). Secrets - MONGO_URI, CORS_ALLOW_ORIGINS,
# CORS_ALLOW_ORIGIN_REGEX - are set with `fly secrets set`, never here. See DEPLOYMENT.md.

app = "nhl-stats-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENABLE_ONDEMAND_FARMING = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # stay up: a cold start re-connects and pings Atlas at import, which the first visitor would wait on
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
